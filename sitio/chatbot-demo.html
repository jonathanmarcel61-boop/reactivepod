<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asistente IA · RehabPod (demo)</title><style>body{margin:0;background:#0a0d0c;color:#f3f6f2;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px;box-sizing:border-box}.panel{width:min(100%,550px);background:#141917;border:1px solid #354137;border-radius:20px;overflow:hidden}header{padding:20px;border-bottom:1px solid #354137}h1{margin:0;font-size:23px}header p{color:#a7b4a9;font-size:13px;margin:5px 0 0}.messages{height:390px;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.bubble{padding:12px 14px;border-radius:14px;max-width:83%;white-space:pre-wrap;line-height:1.5}.assistant{background:#27332a;align-self:flex-start}.user{background:#c6ff4d;color:#10200c;align-self:flex-end}.actions{display:flex;gap:7px;padding:0 15px 12px;flex-wrap:wrap}.actions button{background:transparent;border:1px solid #52654c;color:#c6ff4d;border-radius:12px;padding:8px;cursor:pointer;font-size:12px}form{display:flex;padding:14px;gap:8px;border-top:1px solid #354137}input{min-width:0;flex:1;background:#0a0d0c;color:white;border:1px solid #52654c;border-radius:9px;padding:13px;font:inherit}form button{background:#c6ff4d;color:#10200c;border:0;border-radius:9px;padding:0 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.notice{font-size:12px;color:#a7b4a9;padding:0 17px 16px}</style></head><body><main class="panel"><header><h1>✦ Asistente RehabPod</h1><p>Demostración de atención al cliente con IA · No es asesoramiento médico</p></header><section class="messages" id="messages" aria-live="polite"><div class="bubble assistant">¡Hola! Soy el asistente de RehabPod. ¿Qué te gustaría saber?</div></section><div class="actions"><button type="button" data-q="¿Qué es RehabPod?">¿Qué es RehabPod?</button><button type="button" data-q="¿Cómo se conectan los pods?">Conexión</button><button type="button" data-q="¿Cuánto cuesta?">Precios</button></div><form id="form"><input id="message" maxlength="1000" placeholder="Escribe tu pregunta..." aria-label="Tu pregunta" required><button id="send">Enviar</button></form><p class="notice">No compartas contraseñas, datos médicos ni información sensible. Esta demo no guarda conversaciones en una base de datos.</p></main><script>const form=document.querySelector("#form"),input=document.querySelector("#message"),send=document.querySelector("#send"),area=document.querySelector("#messages"),history=[];function bubble(role,text){const div=document.createElement("div");div.className="bubble "+role;div.textContent=text;area.append(div);area.scrollTop=area.scrollHeight;return div}async function ask(q){q=q.trim();if(!q||send.disabled)return;input.value="";bubble("user",q);history.push({role:"user",content:q});send.disabled=true;const waiting=bubble("assistant","Escribiendo…");try{const res=await fetch("/api/rehabpod-chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history.slice(-12)})});const data=await res.json();if(!res.ok)throw new Error(data.error||"Error del servidor");waiting.textContent=data.answer;history.push({role:"assistant",content:data.answer})}catch(e){waiting.textContent=e.message||"Error de conexión";history.pop()}finally{send.disabled=false;input.focus()}}form.addEventListener("submit",e=>{e.preventDefault();ask(input.value)});document.querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>ask(b.dataset.q)));</script></body></html>
